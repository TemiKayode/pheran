<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0;url=index.html" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PHERAN Admin — Products</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body{font-family:Inter, Arial, sans-serif; margin:0; background:#f7f7fb; color:#1f172a;}
    .admin-shell{max-width:1100px; margin:0 auto; padding:24px;}
    .panel{background:#fff; border:1px solid #e8e2f2; border-radius:16px; padding:20px; box-shadow:0 8px 24px rgba(0,0,0,0.04);}
    .grid{display:grid; grid-template-columns:1.1fr .9fr; gap:20px;}
    label{display:block; font-size:0.9rem; font-weight:700; margin-top:10px; margin-bottom:6px;}
    input, select, textarea{width:100%; padding:10px 12px; border:1px solid #d7cfe6; border-radius:10px;}
    textarea{min-height:90px; resize:vertical;}
    .actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
    button{border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:700;}
    .btn-primary{background:#5b2d8e; color:#fff;}
    .btn-secondary{background:#efeaf8; color:#4b2e6f;}
    .product-list{display:grid; gap:10px; margin-top:16px;}
    .product-item{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:12px; border:1px solid #ece5f6; border-radius:12px; background:#fcfbff;}
    .pill{display:inline-block; padding:4px 8px; border-radius:999px; background:#f0e7ff; color:#5b2d8e; font-size:0.8rem; font-weight:700;}
    .small{font-size:0.85rem; color:#655d78;}
    @media (max-width:800px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <h1>Product Admin</h1>
    <p class="small">Create, update, and publish products. You can add local image files or remote URLs.</p>
    <div class="grid">
      <section class="panel">
        <h2>Product form</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" />
          <label>Name</label>
          <input id="name" required />
          <label>Category</label>
          <input id="category" required />
          <label>Price (NGN)</label>
          <input id="price" type="number" min="0" required />
          <label>Old Price (NGN)</label>
          <input id="oldPrice" type="number" min="0" />
          <label>Rating</label>
          <input id="rating" type="number" step="0.1" min="0" max="5" value="4.5" />
          <label>Availability</label>
          <select id="availability">
            <option value="In Stock">In Stock</option>
            <option value="Limited">Limited</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
          <label>Sizes</label>
          <input id="sizes" placeholder="XS,S,M,L" />
          <label>Colors</label>
          <input id="colors" placeholder="White,Black" />
          <label>Fabric</label>
          <input id="fabric" />
          <label>Upload images</label>
          <input id="images-upload" type="file" accept="image/*" multiple />
          <label>Image URLs or data URLs</label>
          <textarea id="images" placeholder="One URL per line"></textarea>
          <label>Description</label>
          <textarea id="description"></textarea>
          <div class="actions">
            <button class="btn-primary" type="submit">Save product</button>
            <button class="btn-secondary" type="button" id="reset-form">Reset</button>
          </div>
        </form>
      </section>
      <section class="panel">
        <h2>Existing products</h2>
        <div id="product-list" class="product-list"></div>
      </section>
    </div>
  </div>

  <script>
    const form = document.getElementById('product-form');
    const list = document.getElementById('product-list');
    const idInput = document.getElementById('product-id');

    function parseList(value){ return value.split(',').map(v=>v.trim()).filter(Boolean) }
    function parseImages(value){ return value.split(/\n|,/).map(v=>v.trim()).filter(Boolean) }
    function fileToDataUrl(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error || new Error('Failed to read file'));
        reader.readAsDataURL(file);
      });
    }

    async function loadProducts(){
      const res = await fetch('/api/products?perPage=100');
      const data = await res.json();
      renderProducts(data.products || []);
    }

    function renderProducts(products){
      list.innerHTML = '';
      if(!products.length){ list.innerHTML = '<div class="small">No products yet.</div>'; return; }
      products.forEach(product => {
        const item = document.createElement('div');
        item.className = 'product-item';
        item.innerHTML = `
          <div>
            <strong>${product.title}</strong><br/>
            <span class="small">${product.category} • ${product.availability || 'In Stock'} • ₦${product.price}</span>
          </div>
          <div class="actions">
            <button class="btn-secondary" data-edit="${product.id}">Edit</button>
            <button class="btn-primary" data-delete="${product.id}">Delete</button>
          </div>`;
        list.appendChild(item);
      });
      list.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', ()=> editProduct(btn.getAttribute('data-edit'))));
      list.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', ()=> deleteProduct(btn.getAttribute('data-delete'))));
    }

    async function editProduct(id){
      const res = await fetch('/api/products?perPage=100');
      const data = await res.json();
      const product = (data.products || []).find(p => p.id === id);
      if(!product) return;
      idInput.value = product.id;
      document.getElementById('name').value = product.title || '';
      document.getElementById('category').value = product.category || '';
      document.getElementById('price').value = product.price || 0;
      document.getElementById('oldPrice').value = product.oldPrice || '';
      document.getElementById('rating').value = product.rating || 4.5;
      document.getElementById('availability').value = product.availability || 'In Stock';
      document.getElementById('sizes').value = (product.sizes || []).join(',');
      document.getElementById('colors').value = (product.colors || []).join(',');
      document.getElementById('fabric').value = product.fabric || '';
      document.getElementById('images').value = (product.images || []).join('\n');
      document.getElementById('description').value = product.description || '';
    }

    async function deleteProduct(id){
      if(!confirm('Delete this product?')) return;
      const res = await fetch('/api/products/admin', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
      const json = await res.json();
      alert(json.message || 'Deleted');
      loadProducts();
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const selectedFiles = Array.from(document.getElementById('images-upload').files || []);
      const uploadedImages = selectedFiles.length ? await Promise.all(selectedFiles.map(fileToDataUrl)) : [];
      const existingImages = parseImages(document.getElementById('images').value);
      const payload = {
        id: idInput.value || `product-${Date.now()}`,
        title: document.getElementById('name').value,
        category: document.getElementById('category').value,
        price: Number(document.getElementById('price').value),
        oldPrice: Number(document.getElementById('oldPrice').value || 0),
        rating: Number(document.getElementById('rating').value || 4.5),
        availability: document.getElementById('availability').value,
        sizes: parseList(document.getElementById('sizes').value),
        colors: parseList(document.getElementById('colors').value),
        fabric: document.getElementById('fabric').value,
        images: [...uploadedImages, ...existingImages],
        description: document.getElementById('description').value,
        count: 1
      };
      const res = await fetch('/api/products/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const json = await res.json();
      alert(json.message || 'Saved');
      form.reset();
      idInput.value = '';
      document.getElementById('images-upload').value = '';
      loadProducts();
    });

    document.getElementById('reset-form').addEventListener('click', ()=>{ form.reset(); idInput.value=''; document.getElementById('images-upload').value=''; });
    loadProducts();
  </script>
</body>
</html>
