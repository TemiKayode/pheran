<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PHERAN Admin — Sign In</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#F0EBF9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}

    .card{background:#fff;border-radius:20px;box-shadow:0 8px 48px rgba(45,27,78,0.14);width:100%;max-width:420px;overflow:hidden}

    .card-header{background:linear-gradient(135deg,#2D1B4E 0%,#4a2a7a 100%);padding:40px 40px 36px;text-align:center}
    .logo{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;letter-spacing:.2em;color:#fff;display:block;margin-bottom:8px}
    .badge{display:inline-block;background:rgba(212,169,106,.25);border:1px solid rgba(212,169,106,.45);color:#D4A96A;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 12px;border-radius:99px}

    .card-body{padding:36px 40px}

    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:24px}
    .field label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7C6899}
    .pin-wrap{position:relative}
    .pin-wrap input{width:100%;padding:13px 46px 13px 14px;border:1.5px solid #E2D9F3;border-radius:10px;font-size:1rem;font-family:inherit;color:#1C1927;outline:none;transition:border-color .15s;background:#fff;letter-spacing:.1em}
    .pin-wrap input:focus{border-color:#5B2D8E;box-shadow:0 0 0 3px rgba(91,45,142,.1)}
    .pin-wrap input.error{border-color:#dc2626}
    .toggle-vis{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#7C6899;padding:4px;line-height:0}
    .toggle-vis:hover{color:#2D1B4E}

    .error-msg{display:none;color:#dc2626;font-size:.82rem;font-weight:600;margin-top:-16px;margin-bottom:16px;padding:10px 13px;background:#FEF2F2;border-radius:8px;border-left:3px solid #dc2626}
    .error-msg.show{display:block}

    .btn-login{width:100%;padding:14px;background:#2D1B4E;color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:.95rem;font-weight:700;letter-spacing:.03em;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-login:hover:not(:disabled){background:#4a2a7a}
    .btn-login:disabled{opacity:.6;cursor:not-allowed}

    .footer-note{margin-top:28px;text-align:center;font-size:.78rem;color:#9e90b0}
    .footer-note a{color:#5B2D8E;text-decoration:none;font-weight:600}
    .footer-note a:hover{text-decoration:underline}

    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="logo">PHERAN</span>
      <span class="badge">Admin Panel</span>
    </div>
    <div class="card-body">
      <form id="login-form" autocomplete="off">
        <div class="field">
          <label for="pin">Admin PIN</label>
          <div class="pin-wrap">
            <input id="pin" type="password" inputmode="numeric" placeholder="Enter your admin PIN" autocomplete="current-password" autofocus>
            <button type="button" class="toggle-vis" id="toggle-vis" aria-label="Show/hide PIN">
              <svg id="eye-show" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
              <svg id="eye-hide" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" style="display:none"><path d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <button type="submit" class="btn-login" id="submit-btn">
          <span id="btn-text">Sign in to Admin</span>
          <div class="spinner" id="spinner"></div>
        </button>
      </form>

      <p class="footer-note">
        ← <a href="/">Back to site</a>
      </p>
    </div>
  </div>

  <script>
    const form    = document.getElementById('login-form')
    const pinEl   = document.getElementById('pin')
    const errEl   = document.getElementById('error-msg')
    const spinner = document.getElementById('spinner')
    const btnText = document.getElementById('btn-text')
    const submitBtn = document.getElementById('submit-btn')

    // Show/hide PIN toggle
    document.getElementById('toggle-vis').addEventListener('click', () => {
      const hidden = pinEl.type === 'password'
      pinEl.type = hidden ? 'text' : 'password'
      document.getElementById('eye-show').style.display = hidden ? 'none' : ''
      document.getElementById('eye-hide').style.display = hidden ? '' : 'none'
    })

    function setLoading(on) {
      submitBtn.disabled = on
      spinner.style.display = on ? 'block' : 'none'
      btnText.textContent = on ? 'Signing in…' : 'Sign in to Admin'
    }

    function showError(msg) {
      errEl.textContent = msg
      errEl.classList.add('show')
      pinEl.classList.add('error')
      pinEl.focus()
    }

    function clearError() {
      errEl.classList.remove('show')
      pinEl.classList.remove('error')
    }

    pinEl.addEventListener('input', clearError)

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const pin = pinEl.value.trim()
      if (!pin) { showError('Please enter your admin PIN.'); return }
      clearError()
      setLoading(true)
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        })
        const d = await r.json()
        if (d.ok) {
          btnText.textContent = '✓ Signed in'
          window.location.href = '/admin'
        } else {
          showError(d.error || 'Incorrect PIN. Please try again.')
          setLoading(false)
        }
      } catch(e) {
        showError('Network error — please try again.')
        setLoading(false)
      }
    })
  </script>
</body>
</html>
