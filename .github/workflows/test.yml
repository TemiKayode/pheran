name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp/mock-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mvp/mock-server/package-lock.json

      - run: npm ci

      - name: Syntax check
        run: node --check server.js

      # No SUPABASE_* secrets are configured here on purpose — the suite runs
      # entirely against the local bcrypt/JSON fallback auth path, so it never
      # touches production data and needs no test-account credentials.
      - name: Run tests
        run: npm test
